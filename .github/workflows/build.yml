name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image (Android ${{ matrix.android }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # api = system image API level; android 14 also gets :latest and :<sha>
          - { android: "14", api: "34", update_emulator: "0" }
          - { android: "15", api: "35", update_emulator: "1" }
          - { android: "16", api: "36", update_emulator: "1" }
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (the image is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build base image
        run: docker build --build-arg API=${{ matrix.api }} --build-arg UPDATE_EMULATOR=${{ matrix.update_emulator }} -t mdm-emu:base .

      - name: Bake (boots the emulator once, roots it, installs the scanner)
        run: docker run --device /dev/kvm --name bake mdm-emu:base bake

      - name: Commit baked image
        run: |
          docker commit --change 'CMD ["e2e"]' bake mdm-emu:ready
          docker rm bake

      - name: Check device identity (blocks the push if any value does not take)
        run: |
          mkdir -p ids-out
          docker run --rm --device /dev/kvm --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 -v "$PWD/ids-out:/work/out" \
            -e DEVICE_SERIAL=CITEST123 -e DEVICE_IMEI=356938035643809 \
            -e DEVICE_SSAID_KEY=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF \
            -e DEVICE_PHONE=+4477009001 -e DEVICE_IMSI=310260123456789 \
            -e DEVICE_ICCID=89441100000000000017 -e DEVICE_WIFI_MAC=02:11:22:33:44:55 \
            mdm-emu:ready ids
          # and once with random values
          docker run --rm --device /dev/kvm --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 mdm-emu:ready ids

      - name: Scan a dense QR (version 23, 109 modules, like a real enrolment QR)
        run: |
          mkdir -p scan-work
          cp examples/qr-dense.png scan-work/qr.png
          cp examples/qr-dense.json scan-work/qr.json
          docker run --rm --device /dev/kvm --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            -e FRAME_LOG=1 -v "$PWD/scan-work:/work" mdm-emu:ready scan

      - name: start becomes ready (identity applied, IMEI reported)
        run: |
          docker run -d --name ready --device /dev/kvm --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            -e DEVICE_IMEI=356938035643809 mdm-emu:ready start
          for i in $(seq 1 60); do
            docker exec ready test -f /tmp/device-ready && break
            docker ps -q -f name=ready | grep -q . || { docker logs ready | tail -30; exit 1; }
            sleep 10
          done
          docker logs ready | tail -15
          docker exec ready test -f /tmp/device-ready
          docker exec ready adb -s emulator-5554 shell service call iphonesubinfo 1 s16 root | grep -oE "'[^']*'" | tr -d "'.[:space:]" | grep -q 356938035643809
          docker rm -f ready

      - name: Keep identity check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ids-out-android-${{ matrix.android }}
          path: ids-out
          if-no-files-found: ignore

      - name: Tags for this Android version
        run: |
          T="android-${{ matrix.android }} android-${{ matrix.android }}-${GITHUB_SHA::7}"
          # :latest and :<sha> stay Android 14, as before the version tags existed
          [ "${{ matrix.android }}" = 14 ] && T="latest ${GITHUB_SHA::7} $T"
          echo "TAGS=$T" >> "$GITHUB_ENV"
          echo "tags: $T"

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          for t in $TAGS; do
            docker tag mdm-emu:ready "$IMG:$t"
            docker push "$IMG:$t"
          done

      - name: Push to Docker Hub (only when DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN secrets are set)
        if: github.event_name != 'pull_request'
        env:
          DH_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then echo "no Docker Hub secrets, skipped"; exit 0; fi
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          IMG="docker.io/$DH_USER/${GITHUB_REPOSITORY#*/}"
          for t in $TAGS; do
            docker tag mdm-emu:ready "$IMG:$t"
            docker push "$IMG:$t"
          done
