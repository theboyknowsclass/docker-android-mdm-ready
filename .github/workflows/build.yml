name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space (the image is several GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Build base image
        run: docker build -t mdm-emu:base .

      - name: Bake (boots the emulator once, roots it, installs the scanner)
        run: docker run --device /dev/kvm --name bake mdm-emu:base bake

      - name: Commit baked image
        run: |
          docker commit --change 'CMD ["e2e"]' bake mdm-emu:ready
          docker rm bake

      - name: Check device identity (blocks the push if any value does not take)
        run: |
          mkdir -p ids-out
          docker run --rm --device /dev/kvm --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 -v "$PWD/ids-out:/work/out" \
            -e DEVICE_SERIAL=CITEST123 -e DEVICE_IMEI=356938035643809 \
            -e DEVICE_SSAID_KEY=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF \
            -e DEVICE_PHONE=+4477009001 -e DEVICE_IMSI=310260123456789 \
            -e DEVICE_ICCID=89441100000000000017 -e DEVICE_WIFI_MAC=02:11:22:33:44:55 \
            mdm-emu:ready ids
          # and once with random values
          docker run --rm --device /dev/kvm --cap-add NET_ADMIN --sysctl net.ipv6.conf.all.disable_ipv6=0 mdm-emu:ready ids

      - name: Keep identity check output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ids-out
          path: ids-out
          if-no-files-found: ignore

      - name: Push to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag mdm-emu:ready "$IMG:latest"
          docker tag mdm-emu:ready "$IMG:${GITHUB_SHA::7}"
          docker push "$IMG:latest"
          docker push "$IMG:${GITHUB_SHA::7}"

      - name: Push to Docker Hub (only when DOCKER_HUB_USERNAME and DOCKER_HUB_TOKEN secrets are set)
        env:
          DH_USER: ${{ secrets.DOCKER_HUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          if [ -z "$DH_USER" ] || [ -z "$DH_TOKEN" ]; then echo "no Docker Hub secrets, skipped"; exit 0; fi
          echo "$DH_TOKEN" | docker login -u "$DH_USER" --password-stdin
          IMG="docker.io/$DH_USER/${GITHUB_REPOSITORY#*/}"
          docker tag mdm-emu:ready "$IMG:latest"
          docker tag mdm-emu:ready "$IMG:${GITHUB_SHA::7}"
          docker push "$IMG:latest"
          docker push "$IMG:${GITHUB_SHA::7}"
